<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#42A5F5" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90CAF9" />
      <stop offset="50%" stop-color="#42A5F5" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" rx="16" fill="#1a1a1a" />

  <!-- Soft glow behind spinner -->
  <circle cx="150" cy="130" r="100" fill="url(#bg-glow)" />

  <!-- Outer dashed ring (slow counter-rotate) -->
  <circle cx="150" cy="130" r="72" fill="none" stroke="#2a2a2a" stroke-width="3" />
  <circle cx="150" cy="130" r="82" fill="none" stroke="#42A5F5" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="6 8">
    <animateTransform
      attributeName="transform" type="rotate"
      values="360 150 130; 0 150 130" dur="14s" repeatCount="indefinite" />
  </circle>

  <!-- Main spinner arc -->
  <circle cx="150" cy="130" r="58" fill="none" stroke="url(#ring-grad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="40 325">
    <animateTransform
      attributeName="transform" type="rotate"
      values="0 150 130; 360 150 130" dur="1.4s" repeatCount="indefinite" />
    <animate
      attributeName="stroke-dasharray"
      values="40 325; 180 185; 40 325" dur="2s" repeatCount="indefinite"
      calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
  </circle>

  <!-- Inner subtle ring -->
  <circle cx="150" cy="130" r="44" fill="none" stroke="#42A5F5" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="4 6">
    <animateTransform
      attributeName="transform" type="rotate"
      values="0 150 130; -360 150 130" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Orbiting dot -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 150 130; 360 150 130" dur="1.4s" repeatCount="indefinite" />
    <circle cx="150" cy="72" r="4" fill="#90CAF9" />
    <circle cx="150" cy="72" r="8" fill="#90CAF9" opacity="0.25">
      <animate attributeName="r" values="4; 11; 4" dur="1.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Center icon: shield / star shape -->
  <g opacity="0.6">
    <animate attributeName="opacity" values="0.4; 0.8; 0.4" dur="2.5s" repeatCount="indefinite" />
    <polygon points="150,108 155,122 170,122 158,131 162,145 150,136 138,145 142,131 130,122 145,122"
      fill="#42A5F5" stroke="#90CAF9" stroke-width="0.5" />
  </g>

  <!-- Floating particles -->
  <g fill="#90CAF9">
    <circle cx="120" cy="130" r="1.5">
      <animate attributeName="cy" values="130; 85" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 0.7; 0" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="178" cy="145" r="2">
      <animate attributeName="cy" values="145; 100" dur="2.8s" repeatCount="indefinite" begin="0.6s" />
      <animate attributeName="opacity" values="0; 0.6; 0" dur="2.8s" repeatCount="indefinite" begin="0.6s" />
    </circle>
    <circle cx="145" cy="115" r="1">
      <animate attributeName="cy" values="115; 70" dur="1.9s" repeatCount="indefinite" begin="1.1s" />
      <animate attributeName="opacity" values="0; 0.7; 0" dur="1.9s" repeatCount="indefinite" begin="1.1s" />
    </circle>
  </g>

  <!-- "Loading..." text with pulsing animation -->
  <text x="150" y="230" font-family="'Inter', 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#90CAF9" text-anchor="middle" letter-spacing="3">
    Loading...
    <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2s" repeatCount="indefinite" />
  </text>

  <!-- Subtle tagline -->
  <text x="150" y="252" font-family="'Inter', 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="400" fill="#555555" text-anchor="middle" letter-spacing="1">
    MORNING STAR COOPERATIVE
  </text>
</svg>
